# =========================================================
# PARSING - normaliza os campos vindos de fontes diferentes
# =========================================================

filter {

  # ---- Syslog padrão (RFC3164) ----
  if "syslog" in [tags] {
    grok {
      match => {
        "message" => "%{SYSLOGTIMESTAMP:syslog_timestamp} %{SYSLOGHOST:syslog_host} %{DATA:syslog_program}(?:\[%{POSINT:syslog_pid}\])?: %{GREEDYDATA:syslog_message}"
      }
      tag_on_failure => ["_grokparsefailure_syslog"]
    }

    date {
      match => ["syslog_timestamp", "MMM  d HH:mm:ss", "MMM dd HH:mm:ss"]
      target => "@timestamp"
    }

    mutate {
      rename => { "syslog_message" => "message" }
      add_field => { "[event][module]" => "syslog" }
    }
  }

  # ---- Eventos JSON customizados (seu app / scripts de detecção) ----
  if "custom_json" in [tags] {
    mutate {
      add_field => { "[event][module]" => "custom" }
    }
  }

  # ---- Beats (filebeat/winlogbeat já manda estruturado) ----
  if "beats" in [tags] {
    mutate {
      add_field => { "[event][module]" => "beats" }
    }
  }

  # Enriquecimento geográfico quando existir IP de origem
  if [source][ip] {
    geoip {
      source => "[source][ip]"
      target => "[source][geo]"
    }
  }
  if [client][ip] {
    geoip {
      source => "[client][ip]"
      target => "[client][geo]"
    }
  }

  # Define o índice de destino por tipo de evento (usado no output)
  mutate {
    add_field => { "[@metadata][index_prefix]" => "siem-generic" }
  }
  if "syslog" in [tags] {
    mutate { replace => { "[@metadata][index_prefix]" => "siem-syslog" } }
  }
  if "beats" in [tags] {
    mutate { replace => { "[@metadata][index_prefix]" => "siem-beats" } }
  }
  if "custom_json" in [tags] {
    mutate { replace => { "[@metadata][index_prefix]" => "siem-custom" } }
  }
}
