# =========================================================
# INPUTS - portas de entrada da pipeline
# =========================================================

input {
  # Filebeat / Winlogbeat / Auditbeat apontando para cá
  beats {
    port => 5044
    tags => ["beats"]
  }

  # Syslog via UDP (roteadores, firewalls, switches, servidores Linux)
  udp {
    port  => 5514
    type  => "syslog"
    tags  => ["syslog", "udp"]
  }

  # Syslog via TCP (mais confiável para volumes maiores)
  tcp {
    port  => 5514
    type  => "syslog"
    tags  => ["syslog", "tcp"]
  }

  # Entrada genérica em JSON para apps/scripts próprios (ex: seu mini-SIEM
  # mandando eventos customizados, ex: resultado de scans, alertas de IDS)
  tcp {
    port  => 5000
    codec => json_lines
    tags  => ["custom_json"]
  }
}