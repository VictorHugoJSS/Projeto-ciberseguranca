# =========================================================
# DETECÇÃO DE RECONHECIMENTO (Port Scan / Nmap) e SYN Flood
# Requer eventos com campos ECS: [source][ip], [destination][port],
# [network][transport], [tcp][flags][syn]/[ack] — ver sensor/tcp_syn_sensor.py
# =========================================================

filter {
  if [network][transport] == "tcp" and [tcp][flags][syn] and ![tcp][flags][ack] {

    mutate { add_tag => ["tcp_syn"] }

    # ---- Regra 1: muitas portas distintas do mesmo IP em pouco tempo ----
    aggregate {
      id => "agg_portscan"
      task_id => "portscan-%{[source][ip]}"
      code => "
        port = event.get('[destination][port]')
        map['ports'] ||= []
        map['ports'] << port unless map['ports'].include?(port)
        event.set('unique_ports_count', map['ports'].size)
      "
      timeout_task_id_field => "[source][ip]"
      timeout      => 20   # janela de observação: 20s
      timeout_tags => ["portscan_window_closed"]
      push_map_as_event_on_timeout => true
    }

    if [unique_ports_count] and [unique_ports_count] >= 15 {
      mutate {
        add_tag   => ["port_scan_detected"]
        add_field => {
          "[event][category]"     => "intrusion_detection"
          "[event][type]"         => "reconnaissance"
          "[rule][id]"            => "PORTSCAN-001"
          "[rule][description]"   => "Multiplas portas distintas do mesmo IP em janela curta (possivel Nmap scan)"
        }
      }
    }

    # ---- Regra 2: volume alto de SYN do mesmo IP (SYN flood) ----
    aggregate {
      id => "agg_synflood"
      task_id => "synflood-%{[source][ip]}"
      code => "
        map['count'] ||= 0
        map['count'] += 1
        event.set('syn_count', map['count'])
      "
      timeout_task_id_field => "[source][ip]"
      timeout      => 10   # janela de observação: 10s
      timeout_tags => ["synflood_window_closed"]
      push_map_as_event_on_timeout => true
    }

    if [syn_count] and [syn_count] >= 100 {
      mutate {
        add_tag   => ["syn_flood_detected"]
        add_field => {
          "[event][category]"   => "intrusion_detection"
          "[event][type]"       => "denial_of_service"
          "[rule][id]"          => "SYNFLOOD-001"
          "[rule][description]" => "Alto volume de pacotes SYN do mesmo IP em janela curta"
        }
      }
    }
  }

  # Eventos detectados vão para um índice de alertas separado
  if "port_scan_detected" in [tags] or "syn_flood_detected" in [tags] {
    mutate {
      replace => { "[@metadata][index_prefix]" => "siem-alerts" }
    }
  }
}