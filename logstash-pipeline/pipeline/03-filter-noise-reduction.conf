# =========================================================
# REDUÇÃO DE RUÍDO
# Ajuste os padrões abaixo conforme o ruído real do seu ambiente
# =========================================================

filter {

  # ---- 1. Descarte de health checks / monitoramento ----
  if [syslog_program] == "healthcheck" or [message] =~ /GET \/(health|ping|status)\b.*\b200\b/ {
    drop {}
  }

  # ---- 2. Descarte de ruído comum de daemons systemd/cron sem valor de segurança ----
  if [syslog_program] in ["CRON", "systemd-logind"] and [message] !~ /(?i)(fail|error|denied|invalid)/ {
    drop {}
  }

  # ---- 3. Remove campos verbosos que só ocupam espaço no índice ----
  mutate {
    remove_field => ["syslog_timestamp", "host_id", "agent_ephemeral_id"]
  }

  # ---- 4. Deduplicação: gera uma fingerprint do evento para identificar repetições ----
  fingerprint {
    source => ["message", "host", "syslog_program"]
    target => "[@metadata][fingerprint]"
    method => "SHA256"
  }

  # ---- 5. Agregação/supressão de eventos repetidos em rajada ----
  # Requer o plugin: bin/logstash-plugin install logstash-filter-aggregate
  # Ideia: em vez de indexar 500 tentativas de login idênticas, agrega
  # num único evento com contador, resetando a cada 60s.
  if [event][category] == "authentication" and [event][outcome] == "failure" {
    aggregate {
      task_id          => "%{[source][ip]}-%{[user][name]}"
      code             => "map['count'] ||= 0; map['count'] += 1; event.set('failed_login_count', map['count'])"
      push_map_as_event_on_timeout => true
      timeout_task_id_field => "[source][ip]"
      timeout          => 60
      timeout_tags     => ["aggregated_summary"]
    }
    # descarta o evento individual, só deixa passar o resumo agregado
    if "aggregated_summary" not in [tags] and "ssh_bruteforce_detected" not in [tags] {
      drop {}
    }
  }

  # ---- 6. Throttle: limita quantos eventos idênticos passam por janela de tempo ----
  # Requer o plugin: bin/logstash-plugin install logstash-filter-throttle
  # Útil para alertas repetidos de IDS/antivírus que disparam em loop.
  if [event][severity] and [event][severity] == "low" {
    throttle {
      before_count => -1
      after_count  => 3
      period       => 300
      max_age      => 600
      key          => "%{[event][module]}-%{[rule][id]}"
      add_tag      => ["throttled"]
    }
    if "throttled" in [tags] {
      drop {}
    }
  }

    # ---- Rede de segurança: bebês criados pelo "aggregate" (resumos/timeouts)
  # não passam pela primeira etapa, então nunca ganham o crachá de endereço.
  # Aqui a gente dá um crachá padrão pra quem esqueceu.
  if ![@metadata][index_prefix] {
    mutate {
      add_field => { "[@metadata][index_prefix]" => "siem-alerts" }
    }
  }
}