output {
  elasticsearch {
    hosts               => ["https://es01:9200"]
    user                => "elastic"
    password            => "${ELASTIC_PASSWORD}"
    ssl_certificate_authorities => ["/usr/share/elasticsearch/config/certs/ca/ca.crt"]
    index               => "%{[@metadata][index_prefix]}-%{+YYYY.MM.dd}"
  }

  stdout { codec => rubydebug }
}