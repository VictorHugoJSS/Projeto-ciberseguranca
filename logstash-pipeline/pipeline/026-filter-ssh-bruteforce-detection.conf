# =========================================================
# DETECÇÃO DE FORÇA BRUTA SSH
# Parseia linhas sshd do syslog em campos ECS e detecta
# rajadas de falha de autenticação + o login bem-sucedido.
# =========================================================

filter {
  if "syslog" in [tags] and [syslog_program] == "sshd" {

    # ---- Falha de autenticação ----
    grok {
      match => {
        "message" => "Failed password for (invalid user )?%{USERNAME:[user][name]} from %{IP:[source][ip]} port %{NUMBER:[source][port]} ssh2"
      }
      tag_on_failure => []  # não marca falha se não bater (pode ser outra linha do sshd)
    }
    if [source][ip] and [user][name] {
      mutate {
        add_field => {
          "[event][category]" => "authentication"
          "[event][outcome]"  => "failure"
          "[event][action]"   => "ssh_login"
        }
      }
    }

    # ---- Login bem-sucedido ----
    grok {
      match => {
        "message" => "Accepted %{WORD:[event][auth_method]} for %{USERNAME:[user][name]} from %{IP:[source][ip]} port %{NUMBER:[source][port]} ssh2"
      }
      tag_on_failure => []
    }
    if [event][auth_method] {
      mutate {
        add_field => {
          "[event][category]" => "authentication"
          "[event][outcome]"  => "success"
          "[event][action]"   => "ssh_login"
        }
        add_tag => ["ssh_login_success"]
      }
    }

    # ---- Contador de falhas por IP (janela deslizante) ----
    if [event][outcome] == "failure" {
      aggregate {
        id => "agg_ssh_bruteforce"
        task_id => "sshbrute-%{[source][ip]}"
        code => "
          map['count'] ||= 0
          map['count'] += 1
          event.set('failed_login_count', map['count'])
        "
        timeout_task_id_field => "[source][ip]"
        timeout      => 60    # janela de observação: 60s
        timeout_tags => ["bruteforce_window_closed"]
        push_map_as_event_on_timeout => true
      }

      if [failed_login_count] and [failed_login_count] >= 5 {
        mutate {
          add_tag   => ["ssh_bruteforce_detected"]
          add_field => {
            "[rule][id]"          => "SSHBRUTE-001"
            "[rule][description]" => "5+ falhas de autenticação SSH do mesmo IP em 60s"
          }
        }
      }
    }
  }

  # Alertas vão para o índice separado, igual ao port scan
  if "ssh_bruteforce_detected" in [tags] or "ssh_login_success" in [tags] {
    mutate {
      replace => { "[@metadata][index_prefix]" => "siem-alerts" }
    }
  }
}